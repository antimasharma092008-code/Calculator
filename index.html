
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator | </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #07111f, #173b69, #2563eb);
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 360px;
    background: #101827;
    padding: 24px;
    border-radius: 25px;
    box-shadow: 0 20px 50px #0008;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
    font-size: 25px;
}

.display {
    width: 100%;
    min-height: 110px;
    padding: 20px 12px;
    margin-bottom: 20px;
    background: #080e19;
    color: white;
    border-radius: 15px;
    text-align: right;
    overflow-wrap: anywhere;
}

#expression {
    min-height: 24px;
    color: #9ca3af;
    font-size: 16px;
}

#result {
    margin-top: 12px;
    font-size: 32px;
    color: #60a5fa;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 17px 5px;
    font-size: 19px;
    font-weight: bold;
    color: white;
    background: #263449;
    cursor: pointer;
    transition: 0.15s;
}

button:hover {
    filter: brightness(1.3);
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.95);
}

.operator {
    background: #1d4ed8;
}

.action {
    background: #475569;
}

.equal {
    background: #0d9488;
}

.zero {
    grid-column: span 2;
}

footer {
    margin-top: 20px;
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
}
</style>
</head>

<body>
<div class="calculator">
    <h1>Calculator</h1>

    <div class="display">
        <div id="expression">Ready to calculate</div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="action" onclick="clearAll()">AC</button>
        <button class="action" onclick="deleteLast()">DEL</button>
        <button class="action" onclick="percent()">%</button>
        <button class="operator" onclick="addOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="addOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="addOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="addOperator('+')">+</button>

        <button class="action" onclick="toggleSign()">±</button>
        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addDecimal()">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <footer>Simple Calculator | Built with HTML, CSS & JavaScript</footer>
</div>

<script>
let current = '0';
let previous = null;
let operator = null;
let resetNext = false;

const resultEl = document.getElementById('result');
const expressionEl = document.getElementById('expression');

function updateDisplay() {
    resultEl.textContent = current;
}

function addNumber(number) {
    if (current === 'Error' || resetNext) {
        current = number;
        resetNext = false;
    } else if (current === '0') {
        current = number;
    } else if (current.length < 16) {
        current += number;
    }
    updateDisplay();
}

function addDecimal() {
    if (current === 'Error' || resetNext) {
        current = '0.';
        resetNext = false;
    } else if (!current.includes('.')) {
        current += '.';
    }
    updateDisplay();
}

function addOperator(op) {
    if (current === 'Error') return;

    if (operator && !resetNext) {
        calculate();
    }

    previous = Number(current);
    operator = op;
    resetNext = true;

    const symbol = op === '*' ? '×' : op === '/' ? '÷' : op;
    expressionEl.textContent = previous + ' ' + symbol;
}

function calculate() {
    if (operator === null || previous === null ||
        current === 'Error' || resetNext) return;

    const a = previous;
    const b = Number(current);
    let answer;

    if (operator === '+') answer = a + b;
    else if (operator === '-') answer = a - b;
    else if (operator === '*') answer = a * b;
    else if (operator === '/') {
        if (b === 0) {
            current = 'Error';
            expressionEl.textContent = 'Cannot divide by zero';
            previous = null;
            operator = null;
            resetNext = true;
            updateDisplay();
            return;
        }
        answer = a / b;
    }

    if (!Number.isFinite(answer)) {
        current = 'Error';
    } else {
        expressionEl.textContent =
            a + ' ' +
            (operator === '*' ? '×' : operator === '/' ? '÷' : operator)
            + ' ' + b + ' =';

        current = String(Number(answer.toPrecision(12)));
    }

    previous = null;
    operator = null;
    resetNext = true;
    updateDisplay();
}

function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    resetNext = false;
    expressionEl.textContent = 'Ready to calculate';
    updateDisplay();
}

function deleteLast() {
    if (current === 'Error' || resetNext) {
        current = '0';
        resetNext = false;
    } else {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        if (current === '-') current = '0';
    }
    updateDisplay();
}

function toggleSign() {
    if (current === 'Error') return;
    current = String(-Number(current));
    updateDisplay();
}

function percent() {
    if (current === 'Error') return;
    current = String(Number(current) / 100);
    updateDisplay();
    resetNext = false;
}

document.addEventListener('keydown', function(event) {
    const key = event.key;

    if (key >= '0' && key <= '9') addNumber(key);
    else if (key === '.') addDecimal();
    else if (['+', '-', '*', '/'].includes(key)) addOperator(key);
    else if (key === 'Enter' || key === '=') {
        event.preventDefault();
        calculate();
    }
    else if (key === 'Backspace') deleteLast();
    else if (key === 'Escape') clearAll();
    else if (key === '%') percent();
});
</script>
</body>
</html>
